<svg
  xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-label="Fast Food Friends logo — hamburger"
>
  <title>Fast Food Friends</title>
  <desc>Logo një hamburgeri me pak tej</desc>
  <rect width="512" height="512" rx="96" fill="#0F0A06" />
  <g transform="translate(256 256)">
    {/* bun top */}
    <path
      d="M-150 -90a64 64 0 0 1 300 0z"
