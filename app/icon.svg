    {/* fillings */}
    <rect x="-150" y="-26" width="300" height="22" rx="4" fill="#5C1C01" />
    <circle cx="-55" cy="8" r="14" fill="#FDBB05" />
    <rect x="-150" y="2" width="300" height="30" rx="4" fill="#FDF5E0" />
    <rect x="-150" y="36" width="300" height="22" rx="4" fill="#97E34D" />
    <path
      d="M-150 60a30 30 0 0 1 300 0z"
      fill="#EA7C03"
